[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-active-recall"
version = "0.1.0"
description = "Markdown-first, harness-agnostic active recall learning workspace tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
ocr = []
local-embeddings = ["sentence-transformers>=2.6"]
milvus = ["pymilvus>=2.4"]
all = ["pypdf>=4", "sentence-transformers>=2.6", "pymilvus>=2.4"]

[project.scripts]
learning = "active_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
